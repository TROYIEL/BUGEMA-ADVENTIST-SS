services:
  db:
    image: postgres:17-alpine
    container_name: bass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bass_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bass}
      # Deterministic collation so ORDER BY behaves identically everywhere.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bass-db-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, `prisma migrate` races the first boot and fails.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bass} -d ${POSTGRES_DB:-bass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bass-db-data:
    name: bass-db-data
