name: Build and deploy

on:
  push:
    branches:
      - eli-working
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: admin
            context: ./admin
            image: bass-admin
          - name: web
            context: ./web
            image: bass-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image namespace
        id: namespace
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/${{ matrix.app.image }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/${{ matrix.app.image }}:latest
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}   


  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
#     environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image namespace
        id: namespace
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.deploy.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_IMAGE: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/bass-admin:${{ env.IMAGE_TAG }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ steps.namespace.outputs.value }}/bass-web:${{ env.IMAGE_TAG }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ADMIN_IMAGE,WEB_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            mkdir -p admin web
            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export ADMIN_IMAGE WEB_IMAGE
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml run --rm admin npm run db:deploy
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
