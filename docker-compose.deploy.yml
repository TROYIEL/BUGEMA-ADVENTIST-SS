services:
  admin:
    image: ${ADMIN_IMAGE:?ADMIN_IMAGE is required}
    container_name: bass-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    ports:
      - "${ADMIN_PORT:-4001}:4001"
    volumes:
      - bass-storage:/app/storage
    networks:
      - bass-network

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: bass-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    ports:
      - "${WEB_PORT:-4000}:4000"
    volumes:
      - bass-storage:/app/storage
    networks:
      - bass-network

volumes:
  bass-storage:
    name: bass-storage

networks:
  bass-network:
    name: bass-network
