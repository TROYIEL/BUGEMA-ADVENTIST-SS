  # Proves the hosted database answers before anything else starts. `docker
  # compose up` runs it once and gates admin and web on its success; run it
  # on its own with `docker compose run --rm db-check`. It uses the same
  # connection strings the admin project uses and never writes anything.
  db-check:
    image: postgres:17-alpine
    env_file:
      - ./admin/.env
    environment:
      PGCONNECT_TIMEOUT: "10"
      # The URLs carry sslmode=verify-full; psql would look for its own
      # ~/.postgresql/root.crt unless told to trust the system CA store.
      PGSSLROOTCERT: system
    entrypoint: ["sh", "-ec"]
    command:
      - |
        if [ -n "$$DATABASE_URL_UNPOOLED" ]; then
          echo "direct connection (migrations, scripts):"
          psql "$$DATABASE_URL_UNPOOLED" -Atc "select '  ok  ' || current_database() || ' as ' || current_user"
        fi
        echo "pooled connection (the apps):"
        psql "$$DATABASE_URL" -Atc "select '  ok  ' || current_database() || ' at ' || now()::timestamp(0)"
        echo "Database reachable."
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: bass-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      db-check:
        condition: service_completed_successfully
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bass-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db-check:
        condition: service_completed_successfully
